:root{
  --bb-green:#0f2018;
  --bb-paper:#faf6ee;
  --bb-ink:#13261d;
  --bb-olive:#4f5b32;
  --bb-lime:#a6b84c;
  --bb-lime-soft:#c4d08a;
  --bb-sage:#bcc69a;
  --ease-bb:cubic-bezier(0.22,0.61,0.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:900px;overflow:hidden;background:var(--bb-green)}
body{
  color:var(--bb-paper);
  font-family:"Rubik",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.lienzo{
  position:relative;
  width:1600px;height:900px;
  padding:96px;
  display:flex;flex-direction:column;
  gap:38px;
  background:var(--bb-green);
  overflow:hidden;
}
.eyebrow,.atrib{
  font-family:"Spline Sans Mono",ui-monospace,monospace;
  font-size:14px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--bb-sage);
  line-height:1;
}
.atrib{margin-top:auto}
.marca-fila{display:flex;align-items:center;gap:28px}
.marca-texto{font-size:40px;font-weight:500;letter-spacing:-.01em;line-height:1}
h1{
  display:flex;flex-direction:column;
  max-width:22ch;
  font-weight:500;
  font-size:92px;
  line-height:1.03;
  letter-spacing:-.028em;
}
h1>span{display:block}
.lima{display:inline}
.lima{color:var(--bb-lime-soft)}

/* ── Marca de bb.: la gota con las dos b y sus pupilas (Marca.astro, size 120 / eyes 56) ── */
.marca{
  --marca-size:120px;
  --ojo:56px;
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:var(--marca-size);height:var(--marca-size);
  background:linear-gradient(152deg,var(--bb-olive) 0%,var(--bb-lime) 100%);
  border-radius:78% 22% 64% 36% / 40% 72% 28% 60%;
}
.marca-ojos{display:inline-flex;align-items:flex-start;gap:calc(var(--ojo) * .035);line-height:1}
.marca-ojo{
  position:relative;display:inline-block;
  width:calc(var(--ojo) * .575);height:var(--ojo);
  transform-origin:50% 60%;
}
.marca-b{display:block;font:600 var(--ojo)/1 "Instrument Sans",system-ui,sans-serif;color:var(--bb-paper);letter-spacing:0}
.marca-pupila{
  position:absolute;
  left:calc(var(--ojo) * .19);top:calc(var(--ojo) * .545);
  width:calc(var(--ojo) * .136);height:calc(var(--ojo) * .136);
  border-radius:50%;background:var(--bb-ink);
}

/* ── Entrada escalonada ── */
@keyframes bb-in{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}
[data-reveal]{
  opacity:0;
  animation:bb-in .7s var(--ease-bb) both;
  animation-delay:var(--d,0s);
}

/* ── Loops de la marca ── */
@keyframes bb-look{
  0%,100%{transform:translateX(0)}
  30%{transform:translateX(-11%)}
  60%{transform:translateX(9%)}
}
@keyframes bb-blink-loop{
  0%,91%,100%{transform:scaleY(1)}
  94%{transform:scaleY(.08)}
}
.marca-ojo{animation:bb-blink-loop 6.4s ease-in-out infinite}
.marca-pupila{animation:bb-look 5.6s ease-in-out infinite}

@media (prefers-reduced-motion: reduce){
  [data-reveal]{opacity:1;animation:none;transform:none}
  .marca-ojo,.marca-pupila{animation:none}
}
</style>
</head>
<body>
<div class="lienzo" aria-hidden="true">
  <span class="eyebrow" data-reveal style="--d:0s">Caso · JS80</span>

  <div class="marca-fila" data-reveal style="--d:.1s">
    <span class="marca">
      <span class="marca-ojos">
        <span class="marca-ojo"><span class="marca-b">b</span><span class="marca-pupila"></span></span>
        <span class="marca-ojo"><span class="marca-b">b</span><span class="marca-pupila"></span></span>
      </span>
    </span>
    <span class="marca-texto">well adjusted, bb.</span>
  </div>

  <h1>
    <span data-reveal style="--d:.2s">ChatGPT te da una respuesta.</span>
    <span data-reveal style="--d:.36s">bb. entiende</span>
    <span data-reveal style="--d:.52s">por qué es <span class="lima">complicado.</span></span>
  </h1>

  <span class="atrib" data-reveal style="--d:.8s">la línea es de Wided, que lo fundó</span>
</div>
</body>
</html>
